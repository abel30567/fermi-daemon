name: Evals

# Live evals (evals/README.md) against the fermi-mcp eval worker:
# - smoke on every non-draft PR head (ready_for_review, then each push): critical + core, k=3, the
#   baseline of evals/matrix.json; a newer push cancels the older run. Reported as a PR comment and
#   the commit status evals/smoke.
# - weekly: every pack, k=5 (--weekly: the soak too), the baseline and every candidate of evals/matrix.json.
# - workflow_dispatch: the smoke, with the harness, model, scenarios and fermi-mcp ref overridable.
# Fork PRs never get the job (it is skipped, not failed). Without the evals environment's
# CLAUDE_CODE_OAUTH_TOKEN secret the job skips its steps with a notice.
on:
  pull_request:
    types: [ready_for_review, synchronize]
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:
    inputs:
      harness:
        description: 'Harness (default: the baseline of evals/matrix.json)'
        type: string
        default: ''
      model:
        description: 'Model (default: the baseline of evals/matrix.json)'
        type: string
        default: ''
      scenarios:
        description: 'Space-separated scenario globs (default: the smoke, critical + core)'
        type: string
        default: ''
      fermi_mcp_ref:
        description: 'fermi-mcp ref for the eval worker'
        type: string
        default: master

# One run per PR: the final commit's run is the one that counts.
concurrency:
  group: evals-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write # the evals/smoke commit status

jobs:
  evals:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    environment: evals
    timeout-minutes: 360
    env:
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
      CLAUDE_CODE_VERSION: 2.1.308
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - id: token
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          echo "ok=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          [ "$HAS_TOKEN" = true ] || echo "::notice::Evals skipped: the evals environment has no CLAUDE_CODE_OAUTH_TOKEN secret"

      # bwrap is the eval sandbox's Linux backend (harness/sandbox.mjs); it needs unprivileged user namespaces.
      - if: steps.token.outputs.ok == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.token.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: abel30567/fermi-mcp
          ref: ${{ inputs.fermi_mcp_ref || 'master' }}
          path: fermi-mcp
          persist-credentials: false
      - if: steps.token.outputs.ok == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - if: steps.token.outputs.ok == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: steps.token.outputs.ok == 'true'
        run: |
          (cd fermi-mcp && bun install --frozen-lockfile)
          npm install --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          echo "CLAUDE_BIN=$RUNNER_TEMP/claude-code/node_modules/.bin/claude" >> "$GITHUB_ENV"

      - id: plan
        if: steps.token.outputs.ok == 'true'
        env:
          EVENT: ${{ github.event_name }}
          IN_HARNESS: ${{ inputs.harness }}
          IN_MODEL: ${{ inputs.model }}
          IN_SCENARIOS: ${{ inputs.scenarios }}
        run: |
          smoke='evals/scenarios/critical/* evals/scenarios/core/*'
          case "$EVENT" in
            schedule)
              entries=$(jq -c '[.baseline] + .candidates' evals/matrix.json) k=5 scenarios='evals/scenarios/*/*' weekly=--weekly title='Evals weekly' ;;
            workflow_dispatch)
              entries=$(jq -c --arg h "$IN_HARNESS" --arg m "$IN_MODEL" '[.baseline | if $h != "" then .harness = $h else . end | if $m != "" then .model = $m else . end]' evals/matrix.json)
              k=3 scenarios=${IN_SCENARIOS:-$smoke} weekly= title='Evals (dispatch)' ;;
            *)
              entries=$(jq -c '[.baseline]' evals/matrix.json) k=3 scenarios=$smoke weekly= title='Evals smoke' ;;
          esac
          {
            echo "entries=$entries"
            echo "k=$k"
            echo "scenarios=$scenarios"
            echo "weekly=$weekly"
            echo "title=$title (${HEAD_SHA:0:7})"
          } >> "$GITHUB_OUTPUT"

      - if: steps.token.outputs.ok == 'true' && github.event_name == 'pull_request'
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context=evals/smoke -f description=running -f target_url="$RUN_URL" > /dev/null

      # The token reaches the runner only on a pipe (fd 3): the secret is unset before anything is
      # started, and scripts/evals-ci.sh hands it to run.mjs and scan-secrets.mjs on fresh pipes.
      - id: run
        if: steps.token.outputs.ok == 'true'
        env:
          EVAL_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ENTRIES: ${{ steps.plan.outputs.entries }}
          K: ${{ steps.plan.outputs.k }}
          SCENARIOS: ${{ steps.plan.outputs.scenarios }}
          WEEKLY: ${{ steps.plan.outputs.weekly }}
          TITLE: ${{ steps.plan.outputs.title }}
        run: |
          exec 3< <(printf '%s' "$EVAL_TOKEN")
          unset EVAL_TOKEN
          set -f # the globs are run.mjs's to expand
          read -ra globs <<<"$SCENARIOS"
          CLAUDE_CODE_OAUTH_TOKEN_FILE_DESCRIPTOR=3 bash scripts/evals-ci.sh --entries "$ENTRIES" -k "$K" --title "$TITLE" \
            --out "$RUNNER_TEMP/evals" --artifacts "$RUNNER_TEMP/evals-artifacts" --worker "$GITHUB_WORKSPACE/fermi-mcp" $WEEKLY --scenarios "${globs[@]}"
          echo "outcome=$(cat "$RUNNER_TEMP/evals/outcome")" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/evals/comment.md" >> "$GITHUB_STEP_SUMMARY"

      # Only summary.json and compare.md per entry, already scanned: never results.json or the attempt dirs (transcripts).
      - if: steps.run.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evals-${{ github.run_id }}
          path: ${{ runner.temp }}/evals-artifacts
          if-no-files-found: error
          retention-days: 30
      - if: steps.run.outcome == 'success' && github.event_name == 'pull_request'
        run: gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/evals/comment.md"
      - if: "!cancelled() && steps.token.outputs.ok == 'true' && github.event_name == 'pull_request'"
        env:
          OUTCOME: ${{ steps.run.outputs.outcome || 'failure' }}
        run: gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$OUTCOME" -f context=evals/smoke -f description="evals $OUTCOME" -f target_url="$RUN_URL" > /dev/null
      - if: steps.run.outputs.outcome == 'failure'
        run: |
          echo "::error::Evals failed: see the report in the job summary"
          exit 1
